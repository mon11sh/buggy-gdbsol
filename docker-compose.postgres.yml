# Provider override: PostgreSQL (bundled container).
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
# Each data service auto-creates its own gdb_*_db on the postgres server.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5433:5432"]          # host 5433 avoids clashing with a local Postgres on 5432; inspect via pgAdmin at localhost:5433 (postgres/postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    environment:
      DatabaseProvider: postgres
      DatabaseUrl: Host=postgres;Port=5432;Database=gdb_auth_db;Username=postgres;Password=postgres
    depends_on:
      postgres: { condition: service_healthy }

  users-service:
    environment:
      DatabaseProvider: postgres
      DatabaseUrl: Host=postgres;Port=5432;Database=gdb_users_db;Username=postgres;Password=postgres
    depends_on:
      postgres: { condition: service_healthy }

  accounts-service:
    environment:
      DatabaseProvider: postgres
      DatabaseUrl: Host=postgres;Port=5432;Database=gdb_accounts_db;Username=postgres;Password=postgres
    depends_on:
      postgres: { condition: service_healthy }

  transactions-service:
    environment:
      DatabaseProvider: postgres
      DatabaseHost: postgres
      DatabasePort: 5432
      DatabaseUser: postgres
      DatabasePassword: postgres
      DatabaseName: gdb_transactions_db
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
